<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset Password · Yapply</title>
  <link rel="icon" href="./assets/favicon.png" />
  <style>
    :root { --bg:#060709; --surface:#14161b; --text:#f4f0e8; --muted:#b3ada0; --line:rgba(255,255,255,0.12); --accent:#c9a84c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line);
      border-radius:18px; padding:28px 24px; box-shadow:0 24px 60px rgba(0,0,0,0.4); }
    h1 { font-size:1.4rem; margin:0 0 6px; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:0.9rem; }
    label { display:block; font-size:0.82rem; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
      background:rgba(255,255,255,0.03); color:var(--text); font-size:1rem; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:20px; padding:13px; border-radius:12px; border:0; cursor:pointer;
      background:var(--accent); color:#14161b; font-weight:800; font-size:1rem; }
    button:disabled { opacity:0.6; cursor:default; }
    .msg { margin-top:14px; font-size:0.88rem; min-height:1.2em; }
    .msg.err { color:#ff6b6b; } .msg.ok { color:#3fbf7f; }
    a { color:var(--accent); }
    .foot { margin-top:18px; text-align:center; font-size:0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Set a new password</h1>
    <p class="sub" id="subtitle">Choose a new password for your Yapply account.</p>
    <div id="form-wrap">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" />
      <button id="submit">Update password</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="foot"><a href="./login.html">Back to sign in</a></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://sgoicvqgfydwfpttzgqu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnb2ljdnFnZnlkd2ZwdHR6Z3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTY0MDgsImV4cCI6MjA4ODg5MjQwOH0.UOsoPsANDynWmiZ4eWM_dLYU8dBsZvALraKKLqHC6Wg";

    // Turkish if the link came from a TR context (best-effort).
    const isTr = (navigator.language || "").toLowerCase().startsWith("tr");
    if (isTr) {
      document.getElementById("title").textContent = "Yeni şifre belirleyin";
      document.getElementById("subtitle").textContent = "Yapply hesabınız için yeni bir şifre seçin.";
      document.querySelector('label[for="pw"]').textContent = "Yeni şifre";
      document.getElementById("pw").placeholder = "En az 6 karakter";
      document.querySelector('label[for="pw2"]').textContent = "Şifreyi onayla";
      document.getElementById("pw2").placeholder = "Şifreyi tekrar girin";
      document.getElementById("submit").textContent = "Şifreyi güncelle";
      document.querySelector(".foot a").textContent = "Girişe dön";
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: "implicit" },
    });

    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");
    const formWrap = document.getElementById("form-wrap");
    const setMsg = (t, ok) => { msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); };

    let hasRecovery = false;
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || session) hasRecovery = true;
    });

    // Give Supabase a moment to parse the recovery token from the URL.
    setTimeout(async () => {
      const { data } = await supabase.auth.getSession();
      if (!data?.session && !hasRecovery) {
        setMsg(isTr
          ? "Bağlantı geçersiz veya süresi dolmuş. Lütfen tekrar şifre sıfırlama isteyin."
          : "This link is invalid or expired. Please request a new reset link.", false);
      }
    }, 800);

    btn.addEventListener("click", async () => {
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      if (pw.length < 6) { setMsg(isTr ? "Şifre en az 6 karakter olmalı." : "Password must be at least 6 characters.", false); return; }
      if (pw !== pw2) { setMsg(isTr ? "Şifreler eşleşmiyor." : "Passwords do not match.", false); return; }
      btn.disabled = true;
      setMsg(isTr ? "Güncelleniyor…" : "Updating…", true);
      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) {
        setMsg(error.message || (isTr ? "Şifre güncellenemedi." : "Could not update password."), false);
        btn.disabled = false;
        return;
      }
      formWrap.style.display = "none";
      setMsg(isTr ? "Şifreniz güncellendi! Şimdi giriş yapabilirsiniz." : "Your password has been updated! You can now sign in.", true);
      setTimeout(() => { window.location.href = "./login.html"; }, 2200);
    });
  </script>
</body>
</html>
